name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Coverage gate (80% on :sync, :core:data, :core:crypto)
        # Debug-variant verify: the total task merges debug+release variants
        # and reads never-run release tests as uncovered lines.
        run: ./gradlew koverVerifyDebug koverXmlReportDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            build/reports/kover/**
          retention-days: 14

  release-apk:
    # Signed, installable release APK — the deliverable. Published as a
    # workflow artifact on every green master build, and attached to a
    # GitHub Release on v* tags.
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KEYSTORE_FILE: keystore/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          # tr strips any stray CR/LF a secret may carry from the tool that
          # uploaded it; base64 -d rejects those outright.
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > keystore/release.jks
          keytool -list -keystore keystore/release.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Name the APK by version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          out="sambaloader-v${version}-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sambaloader-release-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.file }}" --title "${GITHUB_REF_NAME}" --generate-notes

  # Testcontainers integration (M5) and instrumented emulator tests (M5/M7)
  # get their own pull-request jobs when those milestones land.
