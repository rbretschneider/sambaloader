# ============================================================
# LAN-ONLY LISTENER. NEVER FORWARD PORT 8443 ON THE ROUTER.
# Anyone who can reach this port can enroll a device.
# ============================================================
#
# Plain TLS (same server certificate), no client certificate — this is
# what makes first-time enrollment possible. Serves the admin page and
# proxies the enrollment endpoints (SERVER_SPEC §4.2).
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ca/server.crt;
    ssl_certificate_key /etc/nginx/ca/server.key;
    ssl_protocols       TLSv1.3;

    location = / {
        root /usr/share/nginx/admin;
        try_files /index.html =404;
    }

    location /enroll/ {
        proxy_pass http://uploadd:8080;
    }

    location /qr {
        proxy_pass http://uploadd:8080;
    }

    location /admin/ {
        proxy_pass http://uploadd:8080;
    }
}
