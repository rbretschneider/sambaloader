# ============================================================
# API LISTENER — the ONLY port ever forwarded on the router.
#
# Mutual TLS is enforced HERE: a connection that cannot present a
# certificate signed by the private CA dies during the handshake and
# never reaches uploadd. If you terminate TLS in your own nginx
# instead, replicate this server block exactly — every directive
# below is load-bearing (SERVER_SPEC §4.1).
# ============================================================
# nginx has no built-in $ssl_client_s_dn_cn — extract the CN from the
# full subject DN. (The FRD's original snippet assumed the variable
# exists; it does not, and nginx refuses to start.)
map $ssl_client_s_dn $client_cert_cn {
    default "";
    "~CN=(?<cn>[^,]+)" $cn;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ca/server.crt;
    ssl_certificate_key /etc/nginx/ca/server.key;
    # Both ends are ours: TLS 1.3 only removes all legacy surface.
    ssl_protocols       TLSv1.3;

    # The mTLS core: trust exactly the private CA, check the CRL.
    ssl_client_certificate /etc/nginx/ca/ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       1;
    ssl_crl                /etc/nginx/ca/crl.pem;

    # 0 disables the 1 MB default; without it every video 413s.
    client_max_body_size 0;
    # Stream bodies through instead of spooling whole files to proxy disk.
    proxy_request_buffering off;

    # ONLY /api/ — enrollment endpoints must never be reachable here.
    location /api/ {
        proxy_pass http://uploadd:8080;
        proxy_set_header X-Device-CN     $client_cert_cn;
        proxy_set_header X-Device-Serial $ssl_client_serial;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
